name: Gitleaks full history scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          curl -sSfL --retry 4 --retry-max-time 60 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          rm /tmp/gitleaks.tar.gz
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/gitleaks-bin:$PATH"
          gitleaks version

      - name: Scan full history
        run: |
          set -uo pipefail
          gitleaks git \
            --log-opts="--all" \
            --redact \
            --no-banner . > "$RUNNER_TEMP/gitleaks.log" 2>&1
          rc=$?
          tail -n 30 "$RUNNER_TEMP/gitleaks.log" || true
          rm -f "$RUNNER_TEMP/gitleaks.log"
          if [ "$rc" -eq 1 ]; then
            echo "::error::Gitleaks found leaks in repository history. Investigate before proceeding."
          fi
          exit "$rc"
