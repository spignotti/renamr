name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run nox
      - name: Audit dependencies
        run: uv run pip-audit
  gitleaks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: gitleaks-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determine PR commit range
        id: range
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${#HEAD_SHA}" -ne 40 ]; then
            echo "::error::Invalid PR head SHA"
            exit 1
          fi
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "::error::Checked out HEAD ($head) differs from expected PR head ($HEAD_SHA)"
            exit 1
          fi
          base="$(git merge-base refs/remotes/origin/main "$head")"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -sSfL --retry 4 --retry-max-time 60 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm /tmp/gitleaks.tar.gz
          gitleaks version

      - name: Scan PR commits
        run: |
          set -uo pipefail
          gitleaks git \
            --log-opts="${{ steps.range.outputs.base }}..${{ steps.range.outputs.head }}" \
            --redact \
            --no-banner .
          rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "::error::Gitleaks found leaks in this PR. Review the redacted output above."
          fi
          exit "$rc"
