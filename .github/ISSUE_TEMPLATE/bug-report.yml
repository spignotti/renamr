name: Bug report
description: Report something that does not work as described
title: "bug: "
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the failure. Include the exact renamr command, subcommand, and flags used.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: The shortest sequence that reproduces the problem, including inbox layout and file type where relevant.
      placeholder: |
        1. ...
        2. ...
        3. Observe ...
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: renamr version, OS, Python version, and LLM provider/model in use.
      placeholder: "e.g. renamr 1.3.0, macOS, Python 3.12, openrouter/openai/gpt-4o-mini"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else relevant — redacted logs, config shape (never secrets), related issues. Do not paste API keys or file content from sensitive documents.
    validations:
      required: false
